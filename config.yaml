# CheapRoute configuration.
# Every value here can be overridden by an environment variable (see src/cheaproute/config.py),
# so the container can be re-tuned at kickoff WITHOUT rebuilding the image.

local:
  # OpenAI-compatible endpoint. In production this is vLLM (ROCm) serving Gemma.
  # Set backend to "mock" for GPU-free development/testing on any machine.
  backend: mock            # "openai" (vLLM/any OpenAI-compatible server) | "mock"
  base_url: http://127.0.0.1:8000/v1
  model: google/gemma-3-4b-it
  max_tokens: 512
  timeout_s: 60
  # Self-consistency: how many local samples to draw (1 = single greedy answer).
  # Local tokens are FREE in scoring, so extra samples only cost latency.
  num_samples: 3
  sample_temperature: 0.7

remote:
  backend: mock            # "fireworks" | "mock"
  base_url: https://api.fireworks.ai/inference/v1
  # Verify the exact Fireworks model id at Phase 3 (catalog may differ).
  model: accounts/fireworks/models/gemma-3-27b-it
  max_tokens: 400
  timeout_s: 45
  retries: 2
  backoff_s: 1.0

routing:
  # Escalate to remote when composite confidence < threshold.
  threshold: 0.62
  # Composite weights: confidence = w_logprob*logprob_score + w_agreement*agreement + w_format*format_ok
  w_logprob: 0.45
  w_agreement: 0.40
  w_format: 0.15
  # Mean-logprob normalization range: mapped linearly onto [0, 1].
  logprob_floor: -2.5
  logprob_ceil: -0.05

adapter: stdio             # "stdio" | "http" | "cli"
http_port: 8080

log_path: logs/decisions.jsonl
